[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "autonomous-discovery-lab"
version = "0.1.0"
description = "Persistent, bounded research workflows with independently evaluated evidence"
requires-python = ">=3.12,<3.13"
dependencies = ["pydantic>=2.12,<3", "httpx>=0.28,<1"]

[project.scripts]
autodiscover = "autodiscover.cli:main"

[dependency-groups]
dev = ["pytest>=8.4,<10", "ruff>=0.14,<1", "pyright>=1.1.400,<2"]

[tool.hatch.build.targets.wheel]
packages = ["src/autodiscover"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
